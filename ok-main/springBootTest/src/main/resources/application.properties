spring.application.name=springBootTest
spring.profiles.active=dev

# ===== 服务端口与上下文路径（与前端 src/api.js 的 http://localhost:8081/api 对应）=====
server.port=8081
server.servlet.context-path=/api

# ===== MySQL 数据源（本地 root/123456）=====
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/onepiece?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ===== MyBatis-Plus =====
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.banner=false

# ===== 日志 =====
logging.level.root=info
logging.level.com.fenglin.springboottest=debug
logging.file.name=log/xx.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %level %logger{50}.%M %L:%m%n
