<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>斗破苍穹 · 人物关系历程图</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --gold:#d4af37;--gold2:#f5d76e;--flame:#e2542a;--flame2:#ff8c42;
    --ink:#0c0a09;--ink2:#171310;--panel:rgba(24,19,16,.92);--line:rgba(212,175,55,.28);
    --txt:#e8dcc0;--muted:#a8926b;--label:#c8b78e;
  }
  html,body{height:100%;font-family:"Microsoft YaHei","PingFang SC",serif;color:var(--txt)}
  body{
    background:
      radial-gradient(circle at 50% -10%,rgba(226,84,42,.22),transparent 45%),
      radial-gradient(circle at 85% 110%,rgba(212,175,55,.14),transparent 45%),
      linear-gradient(160deg,#0c0a09 0%,#171310 45%,#0c0a09 100%);
    min-height:100vh;overflow-x:hidden;position:relative;
  }
  .embers{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .ember{position:absolute;bottom:-20px;width:3px;height:3px;border-radius:50%;
    background:var(--flame2);box-shadow:0 0 8px 2px var(--flame);animation:rise linear infinite}
  @keyframes rise{0%{transform:translateY(0) scale(1);opacity:.8}100%{transform:translateY(-110vh) scale(.2);opacity:0}}

  .wrap{position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:28px 22px 60px}
  header{text-align:center;padding:14px 10px 22px}
  header .kicker{font-size:11px;letter-spacing:7px;color:#8c7a5c;margin-bottom:10px}
  header h1{font-size:34px;letter-spacing:12px;color:var(--gold2);font-weight:800;
    text-shadow:0 0 26px rgba(212,175,55,.45)}
  header .tag{margin-top:10px;font-size:12.5px;letter-spacing:5px;color:#a8926b}
  header .rule{width:200px;height:1px;margin:16px auto 0;
    background:linear-gradient(90deg,transparent,var(--gold),transparent)}

  .tabs{display:flex;justify-content:center;gap:10px;margin:6px 0 20px;flex-wrap:wrap}
  .tab{padding:9px 26px;border:1px solid var(--line);border-radius:20px;background:rgba(0,0,0,.3);
    color:var(--muted);font-size:13px;letter-spacing:2px;cursor:pointer;transition:.2s}
  .tab:hover{color:var(--gold2);border-color:var(--gold)}
  .tab.on{color:#1a1206;font-weight:700;border-color:var(--gold2);
    background:linear-gradient(90deg,#c99a2e,#f5d76e,#c99a2e);box-shadow:0 0 18px rgba(212,175,55,.3)}

  .panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);
    box-shadow:0 18px 60px rgba(0,0,0,.6),inset 0 0 50px rgba(226,84,42,.04);overflow:hidden}
  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;
    border-bottom:1px solid rgba(212,175,55,.16);background:rgba(0,0,0,.22)}
  .bar .hint{font-size:11.5px;color:var(--muted);margin-right:auto}
  .legend{display:flex;gap:13px;flex-wrap:wrap}
  .lg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--label);cursor:pointer;user-select:none}
  .lg.off{opacity:.32}
  .lg i{width:16px;height:0;border-top:2px solid;display:inline-block}
  .btn{height:28px;padding:0 13px;border-radius:7px;cursor:pointer;font-size:12px;
    color:var(--muted);background:transparent;border:1px solid rgba(212,175,55,.28)}
  .btn:hover{color:var(--gold2);border-color:var(--gold)}

  /* ===== 关系图谱 ===== */
  #graphBox{position:relative;height:760px}
  #graphSvg{width:100%;height:100%;display:block;cursor:grab}
  #graphSvg.drag{cursor:grabbing}
  .node{cursor:pointer;transition:opacity .25s}
  .node.dim{opacity:.16}
  .node text{pointer-events:none;font-family:"Microsoft YaHei","PingFang SC",serif}
  .edge{transition:opacity .25s,stroke-width .25s}
  .edge.dim{opacity:.07}
  .edge.hot{stroke-width:2.6}
  .edge-label{font-size:10px;pointer-events:none;transition:opacity .25s}
  .edge-label.dim{opacity:0}
  #tip{position:fixed;z-index:20;pointer-events:none;display:none;padding:9px 12px;border-radius:8px;
    border:1px solid var(--line);background:rgba(12,10,9,.96);box-shadow:0 8px 24px rgba(0,0,0,.6);
    font-size:12px;line-height:1.7;color:var(--txt);max-width:240px}
  #tip b{color:var(--gold2);font-size:13px}

  /* ===== 成长历程 ===== */
  #timeBox{display:none}
  .filters{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid rgba(212,175,55,.14)}
  .chip{padding:5px 13px;border-radius:14px;border:1px solid rgba(212,175,55,.25);
    background:rgba(0,0,0,.25);color:var(--muted);font-size:11.5px;cursor:pointer;transition:.2s}
  .chip:hover{color:var(--gold2);border-color:var(--gold)}
  .chip.on{color:#1a1206;background:var(--gold2);border-color:var(--gold2);font-weight:700}
  .gridScroll{overflow:auto;max-height:680px;padding:0 0 10px}
  .grid{min-width:2560px}
  .grid .row{display:flex;border-bottom:1px solid rgba(212,175,55,.08)}
  .grid .row.head{position:sticky;top:0;z-index:5;background:#1c1612;border-bottom:1px solid var(--line)}
  .cellName{width:150px;min-width:150px;position:sticky;left:0;z-index:4;background:#181310;
    padding:10px 12px;border-right:1px solid rgba(212,175,55,.16);display:flex;align-items:center;gap:9px}
  .row.head .cellName{background:#1c1612;z-index:7;font-size:12px;letter-spacing:2px;color:var(--gold2)}
  .ava{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;
    overflow:hidden;border:1px solid var(--line);font-size:12px;color:#0c0a09;font-weight:800}
  .ava img{width:100%;height:100%;object-fit:cover;display:block;}
  .nm{font-size:12.5px;color:var(--txt);line-height:1.3}
  .nm small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
  .arcCol{width:224px;min-width:224px;padding:8px 10px;border-right:1px solid rgba(212,175,55,.08)}
  .row.head .arcCol{font-size:11.5px;color:var(--gold2);letter-spacing:1px;font-weight:600}
  .row.head .arcCol small{display:block;color:#7d6c50;font-size:9.5px;letter-spacing:0;margin-top:3px;font-weight:400}
  .ms{border-radius:8px;padding:7px 9px;margin:2px 0;cursor:pointer;
    background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(0,0,0,.12));
    border:1px solid rgba(212,175,55,.18);border-left-width:3px;transition:.2s}
  .ms:hover{background:rgba(212,175,55,.12);border-color:var(--gold)}
  .ms .r{font-size:11px;font-weight:700;letter-spacing:.5px}
  .ms .e{font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:3px}
  .empty{height:100%;min-height:52px}

  /* ===== 详情抽屉 ===== */
  #detail{position:fixed;top:0;right:0;width:400px;max-width:92vw;height:100vh;z-index:30;
    background:linear-gradient(160deg,rgba(28,22,18,.99),rgba(12,10,9,.99));
    border-left:1px solid var(--gold);box-shadow:-18px 0 50px rgba(0,0,0,.7);
    transform:translateX(105%);transition:transform .3s ease;overflow-y:auto;padding:26px 24px 50px}
  #detail.open{transform:translateX(0)}
  .close{position:absolute;top:16px;right:18px;width:30px;height:30px;border-radius:50%;
    border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:16px}
  .close:hover{color:var(--gold2);border-color:var(--gold)}
  .dHead{display:flex;align-items:center;gap:14px;margin:6px 0 14px;padding-right:34px}
  .dAva{width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:24px;color:#0c0a09;font-weight:800;overflow:hidden;border:2px solid var(--gold)}
  .dAva img{width:100%;height:100%;object-fit:cover;display:block;}
  .dName{font-size:23px;color:var(--gold2);letter-spacing:2px}
  .dTitle{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.6}
  .dMeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  .pill{font-size:11px;padding:4px 10px;border-radius:12px;border:1px solid var(--line);color:var(--label)}
  .pill b{color:var(--gold2)}
  .dSec{font-size:12px;color:var(--gold);letter-spacing:3px;margin:22px 0 12px;
    padding-bottom:7px;border-bottom:1px solid rgba(212,175,55,.2)}
  .tl{position:relative;padding-left:20px}
  .tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:rgba(212,175,55,.28)}
  .ev{position:relative;margin-bottom:15px}
  .ev::before{content:"";position:absolute;left:-18px;top:5px;width:9px;height:9px;border-radius:50%;
    background:var(--gold2);box-shadow:0 0 8px var(--gold2)}
  .ev .stage{font-size:10.5px;color:#8c7a5c;letter-spacing:1px}
  .ev .realm{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin:4px 0 5px;color:#0c0a09}
  .ev .txt{font-size:11.5px;color:var(--label);line-height:1.65}
  .rel{display:flex;align-items:center;gap:9px;font-size:11.5px;padding:6px 0;color:var(--label);cursor:pointer}
  .rel:hover{color:var(--gold2)}
  .rel i{width:7px;height:7px;border-radius:50%;flex:none}
  .rel span{color:var(--muted)}
  footer{text-align:center;font-size:11px;color:#6b5c44;line-height:1.9;margin-top:26px;letter-spacing:1px}
  @media(max-width:760px){#graphBox{height:560px}header h1{font-size:24px;letter-spacing:6px}#detail{width:100%}}
</style>
</head>

<div class="embers" id="embers"></div>
<div class="wrap">
  <header>
    <div class="kicker">天蚕土豆 · 原著剧情整理</div>
    <h1>斗破苍穹</h1>
    <div class="tag">人物关系历程图　·　三十年河东 三十年河西 莫欺少年穷</div>
    <div class="rule"></div>
  </header>

  <div class="tabs">
    <div class="tab on" data-v="graph">◈　人物关系图谱</div>
    <div class="tab" data-v="time">◈　成长历程时间轴</div>
  </div>

  <section class="panel" id="graphBox">
    <div class="bar">
      <span class="hint">点人物看成长历程 · 拖拽平移 · 滚轮缩放 · 点击关系类型可筛选</span>
      <div class="legend" id="legend"></div>
      <button class="btn" id="resetG">重置视图</button>
    </div>
    <svg id="graphSvg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid meet"></svg>
  </section>

  <section class="panel" id="timeBox">
    <div class="bar">
      <span class="hint">横向为原著剧情阶段 · 纵向为人物 · 色块显示当时境界，点击查看详细历程</span>
    </div>
    <div class="filters" id="filters"></div>
    <div class="gridScroll"><div class="grid" id="grid"></div></div>
  </section>

  <footer>
    内容依据天蚕土豆原著《斗破苍穹》整理；境界节点按原著剧情线归纳，个别年龄为按剧情推演。<br>
    斗气等级：斗之气 → 斗者 → 斗师 → 大斗师 → 斗灵 → 斗王 → 斗皇 → 斗宗 → 斗尊 → 半圣 → 斗圣 → 斗帝
  </footer>
</div>

<div id="tip"></div>
<aside id="detail"><button class="close" id="closeD">✕</button><div id="dBody"></div></aside>

function tier(s){
  if(/斗帝|炎帝|帝炎/.test(s))return'emperor';
  if(/斗圣/.test(s))return'saint';

  if(/斗灵/.test(s))return'spirit';

 ['yao','yan','master','授业恩师'],['xuner','yan','spouse','青梅 · 妻'],['cai','yan','spouse','妻 · 炎盟'],
 ['xiaoyi','yan','love','红颜知己'],['yunyun','yan','love','红颜 · 纠葛'],['yafei','yan','love','红颜 · 相护'],
 ['nalan','yan','rival','退婚 · 三年之约'],['ziyan','yan','ally','挚友 · 龙凰'],['qinglin','yan','ally','侍女 · 追随'],
 ['haibo','yan','ally','冰皇 · 护道'],['xiaozhan','yan','family','父亲'],['xiaoding','yan','family','大哥'],
 ['xiaoxiao','yan','family','女儿'],['hanfeng','yan','enemy','叛徒来袭'],['hun','yan','enemy','终极宿敌'],
 ['guyuan','xuner','family','父女'],['zhukun','ziyan','family','父女'],['cai','xiaoxiao','family','母女'],
 ['yao','hanfeng','master','师徒 · 背叛'],['yunyun','nalan','master','师徒']
];
const byId=Object.fromEntries(C.map(c=>[c.id,c]));

/* ============ 火焰粒子 ============ */
const eb=document.getElementById('embers');
for(let i=0;i<38;i++){const e=document.createElement('div');e.className='ember';
 e.style.left=Math.random()*100+'%';e.style.animationDuration=(6+Math.random()*9)+'s';
 e.style.animationDelay=(Math.random()*9)+'s';e.style.opacity=Math.random()*.6+.2;eb.appendChild(e)}

/* ============ SVG 图谱 ============ */
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('graphSvg');
const mk=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
let vb={x:0,y:0,w:1200,h:900},zoom=1,sel=null;
const offRel=new Set();

function drawGraph(){
  while(svg.firstChild)svg.removeChild(svg.firstChild);
  const defs=mk('defs');
  const grad=mk('radialGradient',{id:'glow'});
  grad.appendChild(mk('stop',{offset:'0%','stop-color':'#ff8c42','stop-opacity':'.55'}));
  grad.appendChild(mk('stop',{offset:'100%','stop-color':'#ff8c42','stop-opacity':'0'}));
  defs.appendChild(grad);
  C.forEach(c=>{const cp=mk('clipPath',{id:'clip-'+c.id});cp.appendChild(mk('circle',{cx:c.x,cy:c.y,r:c.r-1}));defs.appendChild(cp)});
  svg.appendChild(defs);
  const g=mk('g',{transform:`translate(${vb.x} ${vb.y}) scale(${zoom})`});svg.appendChild(g);
  g.appendChild(mk('circle',{cx:600,cy:450,r:230,fill:'url(#glow)',opacity:.5}));

  E.forEach(([a,b,t,label])=>{
    if(offRel.has(t))return;
    const A=byId[a],B=byId[b],r=REL[t];
    const ln=mk('line',{x1:A.x,y1:A.y,x2:B.x,y2:B.y,stroke:r.c,'stroke-width':1.3,opacity:.65,
      'stroke-dasharray':r.dash,class:'edge','data-a':a,'data-b':b});
    g.appendChild(ln);
    const mx=(A.x+B.x)/2,my=(A.y+B.y)/2;
    const tx=mk('text',{x:mx,y:my-4,fill:r.c,'text-anchor':'middle',class:'edge-label','data-a':a,'data-b':b});
    tx.textContent=label;g.appendChild(tx);
  });

  C.forEach(c=>{
    const nd=mk('g',{class:'node','data-id':c.id});
    nd.appendChild(mk('circle',{cx:c.x,cy:c.y,r:c.r+10,fill:c.c,opacity:.09}));
    const circ=mk('circle',{cx:c.x,cy:c.y,r:c.r,fill:c.c,stroke:c.id==='yan'?'#f5d76e':'rgba(0,0,0,.5)',
      'stroke-width':c.id==='yan'?3:2});
    circ.style.filter=`drop-shadow(0 0 10px ${c.c})`;nd.appendChild(circ);
    const img=mk('image',{href:'characters/'+c.id+'_avatar.jpg',x:c.x-c.r+1,y:c.y-c.r+1,
      width:(c.r-1)*2,height:(c.r-1)*2,'clip-path':'url(#clip-'+c.id+')',preserveAspectRatio:'xMidYMid slice'});
    nd.appendChild(img);
    nd.appendChild(mk('circle',{cx:c.x,cy:c.y,r:c.r,fill:'none',
      stroke:c.id==='yan'?'#f5d76e':'rgba(0,0,0,.5)','stroke-width':c.id==='yan'?3:2}));
    const nm=mk('text',{x:c.x,y:c.y+c.r+18,'text-anchor':'middle','font-size':c.id==='yan'?15:12.5,
      'font-weight':c.id==='yan'?800:600,fill:c.id==='yan'?'#f5d76e':'#e8dcc0'});nm.textContent=c.name;nd.appendChild(nm);
    const sub=mk('text',{x:c.x,y:c.y+c.r+32,'text-anchor':'middle','font-size':9.5,fill:'#8c7a5c'});
    sub.textContent=c.title.split(' · ')[0];nd.appendChild(sub);
    nd.addEventListener('click',e=>{e.stopPropagation();select(c.id)});
    nd.addEventListener('mousemove',e=>showTip(e,c));
    nd.addEventListener('mouseleave',hideTip);
    g.appendChild(nd);
  });
  applySel();
}
function applySel(){
  svg.querySelectorAll('.node').forEach(n=>{
    const id=n.dataset.id;
    n.classList.toggle('dim',!!sel&&id!==sel&&!E.some(([a,b])=>(a===sel&&b===id)||(b===sel&&a===id)));
  });
  svg.querySelectorAll('.edge,.edge-label').forEach(n=>{
    const hit=!!sel&&(n.dataset.a===sel||n.dataset.b===sel);
    n.classList.toggle('dim',!!sel&&!hit);
    if(n.classList.contains('edge'))n.classList.toggle('hot',hit);
  });
}
function showTip(e,c){
  const t=document.getElementById('tip');
  t.innerHTML=`<b>${c.name}</b><br>${c.title}<br><span style="color:${TIER[tier(c.final)].c}">${c.final}</span><br><span style="opacity:.7">点击查看完整成长历程 →</span>`;
  t.style.display='block';
  t.style.left=Math.min(e.clientX+16,window.innerWidth-260)+'px';
  t.style.top=Math.min(e.clientY+16,window.innerHeight-130)+'px';
}
function hideTip(){document.getElementById('tip').style.display='none'}
function legend(){
  const box=document.getElementById('legend');
  Object.entries(REL).forEach(([k,v])=>{
    const s=document.createElement('span');s.className='lg';
    s.innerHTML=`<i style="border-color:${v.c};border-top-style:${v.dash?'dashed':'solid'}"></i>${v.n}`;
    s.onclick=()=>{offRel.has(k)?offRel.delete(k):offRel.add(k);s.classList.toggle('off');drawGraph()};
    box.appendChild(s);
  });
}
/* 平移缩放 */
let drag=false,px=0,py=0;
svg.addEventListener('mousedown',e=>{if(e.target.closest('.node'))return;drag=true;px=e.clientX;py=e.clientY;svg.classList.add('drag')});
window.addEventListener('mousemove',e=>{if(!drag)return;const k=1200/svg.getBoundingClientRect().width;
 vb.x+=(e.clientX-px)*k;vb.y+=(e.clientY-py)*k;px=e.clientX;py=e.clientY;drawGraph()});
window.addEventListener('mouseup',()=>{drag=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(2.4,Math.max(.55,zoom*(e.deltaY>0?.9:1.1)));drawGraph()},{passive:false});
document.getElementById('resetG').onclick=()=>{vb={x:0,y:0,w:1200,h:900};zoom=1;sel=null;drawGraph();closeDetail()};

/* ============ 成长时间轴 ============ */
function buildTime(){
  const filters=document.getElementById('filters'),grid=document.getElementById('grid');
  const groups=[...new Set(C.map(c=>c.group))];
  const active=new Set(groups);
  groups.forEach(gp=>{
    const b=document.createElement('span');b.className='chip on';b.textContent=gp;
    b.onclick=()=>{active.has(gp)?active.delete(gp):active.add(gp);b.classList.toggle('on');render()};
    filters.appendChild(b);
  });
  function render(){
    grid.innerHTML='';
    const head=document.createElement('div');head.className='row head';
    head.innerHTML=`<div class="cellName">人物 / 阶段</div>`+ARCS.map(a=>
      `<div class="arcCol">${a.n}<small>${a.s}</small></div>`).join('');
    grid.appendChild(head);
    C.filter(c=>active.has(c.group)).forEach(c=>{
      const row=document.createElement('div');row.className='row';
      const n=document.createElement('div');n.className='cellName';
      n.innerHTML=`<div class="ava" style="box-shadow:0 0 10px ${c.c}"><img src="characters/${c.id}_avatar.jpg" alt="${c.name}" onerror="this.style.display='none';this.parentElement.textContent='${c.name.slice(-1)}';this.parentElement.style.background='${c.c}'"></div>
        <div class="nm">${c.name}<small>${c.title.split(' · ')[0]}</small></div>`;
      row.appendChild(n);
      ARCS.forEach((a,i)=>{
        const cell=document.createElement('div');cell.className='arcCol';
        const list=c.g.filter(x=>x[0]===i);
        if(list.length)list.forEach(([ai,r,e])=>{
          const tc=TIER[tier(r)].c;
          const d=document.createElement('div');d.className='ms';d.style.borderLeftColor=tc;
          d.innerHTML=`<div class="r" style="color:${tc}">${r}</div><div class="e" title="${e}">${e.length>34?e.slice(0,34)+'…':e}</div>`;
          d.onclick=()=>select(c.id);cell.appendChild(d);
        });
        else cell.innerHTML='<div class="empty"></div>';
        row.appendChild(cell);
      });
      grid.appendChild(row);
    });
  }
  render();
}

/* ============ 详情抽屉 ============ */
function select(id){
  sel=id;applySel();
  const c=byId[id];
  const rels=E.filter(([a,b])=>a===id||b===id).map(([a,b,t,l])=>{
    const o=a===id?b:a;return `<div class="rel" data-go="${o}"><i style="background:${REL[t].c}"></i>
      <b style="color:${byId[o].c}">${byId[o].name}</b><span>· ${REL[t].n} · ${l}</span></div>`;
  }).join('');
  const evs=c.g.map(([a,r,e])=>`<div class="ev"><div class="stage">${ARCS[a].n}</div>
    <span class="realm" style="background:${TIER[tier(r)].c}">${r}</span><div class="txt">${e}</div></div>`).join('');
  document.getElementById('dBody').innerHTML=`
    <div class="dHead"><div class="dAva" style="box-shadow:0 0 16px ${c.c}"><img src="characters/${c.id}_avatar.jpg" alt="${c.name}" onerror="this.style.display='none';this.parentElement.textContent='${c.name.slice(-1)}';this.parentElement.style.background='${c.c}'"></div>
      <div><div class="dName">${c.name}</div><div class="dTitle">${c.title}</div></div></div>
    <div class="dMeta"><span class="pill">阵营 <b>${c.group}</b></span>
      <span class="pill">最终境界 <b style="color:${TIER[tier(c.final)].c}">${c.final}</b></span></div>
    <div class="dSec">人物关系</div><div>${rels}</div>
    <div class="dSec">成长历程</div><div class="tl">${evs}</div>`;
  document.querySelectorAll('.rel').forEach(r=>r.onclick=()=>select(r.dataset.go));
  document.getElementById('detail').classList.add('open');
}
function closeDetail(){document.getElementById('detail').classList.remove('open');sel=null;applySel()}
document.getElementById('closeD').onclick=closeDetail;

/* ============ 切换 ============ */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  const v=t.dataset.v;
  document.getElementById('graphBox').style.display=v==='graph'?'block':'none';
  document.getElementById('timeBox').style.display=v==='time'?'block':'none';
  closeDetail();
});
legend();drawGraph();buildTime();
</script>
