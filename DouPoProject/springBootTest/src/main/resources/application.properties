# ===== 斗破苍穹异火图鉴 · 后端配置 =====
spring.application.name=springBootTest
server.port=8080

# ----- 中文编码 -----
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ----- MySQL（本地 root / 123456，库名 doupo）-----
spring.datasource.url=jdbc:mysql://localhost:3306/doupo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- 连接池：MySQL 没起来时快速失败，别让请求卡 30 秒 -----
# connection-timeout 5s：拿不到连接立刻抛异常，前端能马上看到「数据库未连接」
spring.datasource.hikari.connection-timeout=4000
# 启动时连不上也先把服务拉起来（否则后端直接启动失败，前端连 8080 都连不上）
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ----- MyBatis-Plus -----
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ----- 登录令牌（签名密钥固定，重启后端不会让用户掉线）-----
app.token.secret=doupo-flame-token-secret-2026

# ----- 日志 -----
logging.level.root=info
logging.level.com.fenglin.springboottest=info
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n
